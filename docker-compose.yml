services:

  oc-ft:

    build: .

    working_dir: /workspace

    volumes:
      # katalog projektu
      - .:/workspace

      # auth, historia, storage (trwałe między uruchomieniami)
      - oc-ft-storage:/root/.local/share/opencode

    stdin_open: true
    tty: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

volumes:

  oc-ft-storage: